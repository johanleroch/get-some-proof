<svg xmlns="http://www.w3.org/2000/svg" id="blob-anim-pop" viewBox="176 140 648 648" overflow="visible" fill="none" role="img" aria-label="Get Some Proof mascot, pop">
<style>
#blob-anim-pop .body, #blob-anim-pop .eyes, #blob-anim-pop .eye, #blob-anim-pop .arches { transform-box: fill-box; }
#blob-anim-pop .body { transform-origin: 50% 100%; }
#blob-anim-pop .eyes, #blob-anim-pop .eye, #blob-anim-pop .arches { transform-origin: 50% 50%; }
#blob-anim-pop .arches { opacity: 0; }

#blob-anim-pop .body { animation: hop 2.4s infinite; }
#blob-anim-pop .eyes { animation: swap-blink 2.4s cubic-bezier(0.3, 0, 0.2, 1) infinite; }
#blob-anim-pop .eye { animation: pills-out 2.4s step-end infinite; }
#blob-anim-pop .arches { animation: arches-in 2.4s step-end infinite; }
@keyframes hop {
  0%, 6% { transform: translateY(0) scale(1, 1); animation-timing-function: cubic-bezier(0.4, 0, 1, 1); }
  12% { transform: translateY(0) scale(1.07, 0.93); animation-timing-function: cubic-bezier(0.34, 1.4, 0.64, 1); }
  26% { transform: translateY(-44px) scale(0.96, 1.05); animation-timing-function: cubic-bezier(0.5, 0, 0.8, 0.6); }
  40% { transform: translateY(0) scale(1.05, 0.95); animation-timing-function: cubic-bezier(0.45, 0, 0.55, 1); }
  50%, 100% { transform: translateY(0) scale(1, 1); }
}
@keyframes swap-blink {
  0%, 14%, 26%, 84%, 96%, 100% { transform: scaleY(1); }
  19%, 21% { transform: scaleY(0.08); }
  89%, 91% { transform: scaleY(0.08); }
}
@keyframes pills-out {
  0%, 20% { opacity: 1; }
  20.01%, 90% { opacity: 0; }
  90.01%, 100% { opacity: 1; }
}
@keyframes arches-in {
  0%, 20% { opacity: 0; }
  20.01%, 90% { opacity: 1; }
  90.01%, 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) {
  #blob-anim-pop .body, #blob-anim-pop .eyes, #blob-anim-pop .eye, #blob-anim-pop .arches { animation: none !important; }
}
</style>
<g class="body">
<path d="M224 552C224 318 348 228 500 228C652 228 776 318 776 552C776 644 740 712 700 742C662 770 618 718 576 746C540 772 460 772 424 746C382 718 338 770 300 742C260 712 224 644 224 552Z" fill="black"/>
<g filter="url(#blob-shade-pop)"><path d="M224 552C224 318 348 228 500 228C652 228 776 318 776 552C776 644 740 712 700 742C662 770 618 718 576 746C540 772 460 772 424 746C382 718 338 770 300 742C260 712 224 644 224 552Z" fill="url(#blob-fill-pop)"/></g>
<g class="eyes">
<path class="eye" d="M395 458A27 27 0 0 1 449 458V530A27 27 0 0 1 395 530Z" fill="#2E2A25"/>
<path class="eye" d="M551 458A27 27 0 0 1 605 458V530A27 27 0 0 1 551 530Z" fill="#2E2A25"/>
<g class="arches"><path d="M388 511A34 34 0 0 1 456 511" fill="none" stroke="#2E2A25" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/><path d="M544 511A34 34 0 0 1 612 511" fill="none" stroke="#2E2A25" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></g>
</g>
</g>
<defs>
