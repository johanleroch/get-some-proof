name: Visual evidence capture

on:
  pull_request:
    paths:
      - "public/**"
      - "src/**"
      - "convex/**"
      - "components.json"
      - "e2e/visual-evidence.spec.ts"
      - "next.config.ts"
      - "package.json"
      - "playwright.config.ts"
      - "pnpm-lock.yaml"
      - "postcss.config.mjs"
      - "visual-evidence.config.json"

permissions:
  contents: read

concurrency:
  group: visual-capture-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture canonical screens
        run: pnpm test:visual
        env:
          VISUAL_EVIDENCE_DIR: visual-evidence
      - name: Build validated manifest
        run: pnpm visual:manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          VISUAL_EVIDENCE_DIR: visual-evidence
          VISUAL_EVIDENCE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VISUAL_EVIDENCE_TARGET_KIND: pull
          VISUAL_EVIDENCE_TARGET_NUMBER: ${{ github.event.pull_request.number }}
      - uses: actions/upload-artifact@v7
        with:
          name: visual-evidence-${{ github.run_id }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 3
