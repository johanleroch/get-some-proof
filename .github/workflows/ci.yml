name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm typecheck:cloudflare
      - run: pnpm test
      - run: pnpm build
      - run: pnpm build:cloudflare

  browser:
    runs-on: ubuntu-latest
    # The full five-project Playwright matrix currently needs slightly more
    # than 20 minutes on GitHub-hosted runners. Keep enough headroom for the
    # report upload instead of cancelling an otherwise healthy run.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      # Canonical screenshots run in Visual evidence capture; keep this job
      # focused on functional coverage and print failing test names immediately.
      - run: pnpm test:e2e --grep-invert 'captures ' --reporter=list,html
      - run: pnpm test:cloudflare --grep-invert 'captures ' --reporter=list
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
